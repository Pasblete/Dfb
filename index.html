<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Viewport forzado para extender la pantalla detrás del Notch / Dynamic Island -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- CONFIGURACIÓN PANTALLA COMPLETA EN IOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent es IMPRESCINDIBLE para que el HTML se meta DEBAJO de la barra de estado -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inicio">

  <title>Pantalla de Inicio</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Fondo configurado para ocupar el 100% absoluto incluyendo áreas seguras (Notch/Dynamic Island) */
    #pantalla {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      /* Extensión explícita para sobrepasar el Safe Area de iOS */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background-image: url('pagina1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.2s ease-in-out;
    }

    /* Rejilla de botones invisibles sobre los iconos */
    #grid-teclado {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Teclas invisibles */
    .tecla {
      position: absolute;
      width: 21%;   
      height: 11%;  
      opacity: 0;   
    }

    /* Coordenadas de los 10 iconos (Cuadrícula 4x6 de iOS) */
    .num-1 { top: 8%;  left: 6%; }
    .num-2 { top: 8%;  left: 29%; }
    .num-3 { top: 8%;  left: 52%; }

    .num-4 { top: 22%; left: 6%; }
    .num-5 { top: 22%; left: 29%; }
    .num-6 { top: 22%; left: 52%; }

    .num-7 { top: 36%; left: 6%; }
    .num-8 { top: 36%; left: 29%; }
    .num-9 { top: 36%; left: 52%; }

    .num-0 { top: 50%; left: 29%; }

    #link-atajo {
      display: none;
    }
  </style>
</head>
<body>

  <div id="pantalla">
    <!-- Rejilla de 10 botones táctiles invisibles -->
    <div id="grid-teclado">
      <div class="tecla num-1" onclick="registrarDigito('1')"></div>
      <div class="tecla num-2" onclick="registrarDigito('2')"></div>
      <div class="tecla num-3" onclick="registrarDigito('3')"></div>

      <div class="tecla num-4" onclick="registrarDigito('4')"></div>
      <div class="tecla num-5" onclick="registrarDigito('5')"></div>
      <div class="tecla num-6" onclick="registrarDigito('6')"></div>

      <div class="tecla num-7" onclick="registrarDigito('7')"></div>
      <div class="tecla num-8" onclick="registrarDigito('8')"></div>
      <div class="tecla num-9" onclick="registrarDigito('9')"></div>

      <div class="tecla num-0" onclick="registrarDigito('0')"></div>
    </div>
  </div>

  <a id="link-atajo" href=""></a>

  <script>
    // --- NAVEGACIÓN ENTRE PÁGINAS (SWIPE) ---
    const paginas = ['pagina1.jpg', 'pagina2.jpg', 'pagina3.jpg'];
    let paginaActual = 0;

    let touchStartX = 0;
    let touchEndX = 0;

    const pantallaDiv = document.getElementById('pantalla');

    pantallaDiv.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    pantallaDiv.addEventListener('touchend', function(e) {
      touchEndX = e.changedTouches[0].screenX;
      handleGesture();
    }, false);

    function handleGesture() {
      const umbralDesplazamiento = 40;

      // Deslizar a la izquierda (Avanzar página)
      if (touchStartX - touchEndX > umbralDesplazamiento) {
        if (paginaActual < paginas.length - 1) {
          paginaActual++;
          actualizarPagina();
        }
      }

      // Deslizar a la derecha (Retroceder página)
      if (touchEndX - touchStartX > umbralDesplazamiento) {
        if (paginaActual > 0) {
          paginaActual--;
          actualizarPagina();
        }
      }
    }

    function actualizarPagina() {
      pantallaDiv.style.backgroundImage = "url('" + paginas[paginaActual] + "')";
    }

    // --- LÓGICA DE FUERZA (DÍGITOS + ATAJO) ---
    let numeroAcumulado = "";

    function registrarDigito(digito) {
      numeroAcumulado += digito;

      if (numeroAcumulado.length === 2) {
        let numeroFinal = numeroAcumulado;
        numeroAcumulado = "";

        let urlScheme = "shortcuts://run-shortcut?name=DFB_Notas&input=text&text=" + encodeURIComponent(numeroFinal);

        let link = document.getElementById("link-atajo");
        link.href = urlScheme;
        link.click();
      }
    }
  </script>
</body>
</html>
