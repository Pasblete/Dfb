

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Inicio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
    .slider { display: flex; width: 300vw; height: 100vh; transition: transform 0.3s ease-out; }
    .page { width: 100vw; height: 100vh; background-size: cover; background-position: center; position: relative; }
    #page1 { background-image: url('pagina1.jpg'); }
    #page2 { background-image: url('pagina2.jpg'); }
    #page3 { background-image: url('pagina3.jpg'); }

    /* Ajusta estos valores % para que el recuadro caiga sobre tu icono de Notas en la Página 3 */
    .notes-icon-hotspot {
      position: absolute;
      top: 18%; 
      left: 8%;
      width: 75px;
      height: 75px;
    }
  </style>
</head>
<body>

  <div class="slider" id="slider">
    <div class="page" id="page1"></div>
    <div class="page" id="page2"></div>
    <div class="page" id="page3">
      <div class="notes-icon-hotspot" onclick="ejecutarMagia()"></div>
    </div>
  </div>

  <script>
    let currentPage = 1;
    let startX = 0, startY = 0;
    let d1 = null, d2 = null;
    const slider = document.getElementById('slider');

    function getYDigit(y) {
      const screenHeight = window.innerHeight;
      const zone = Math.floor((y / screenHeight) * 10);
      const mapping = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0];
      return mapping[Math.min(zone, 9)];
    }

    document.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });

    document.addEventListener('touchend', (e) => {
      let diffX = startX - e.changedTouches[0].clientX;
      if (diffX > 50) {
        if (currentPage === 1) {
          d1 = getYDigit(startY);
          currentPage = 2;
          slider.style.transform = 'translateX(-100vw)';
        } else if (currentPage === 2) {
          d2 = getYDigit(startY);
          currentPage = 3;
          slider.style.transform = 'translateX(-200vw)';
        }
      }
    });

    function ejecutarMagia() {
      if (d1 !== null && d2 !== null) {
        const numeroFinal = `${d1}${d2}`;
        window.location.href = `shortcuts://run-shortcut?name=DFB_Notas&input=${numeroFinal}`;
      }
    }
  </script>
</body>
</html>
