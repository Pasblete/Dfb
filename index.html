<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- CONFIGURACIÓN PANTALLA COMPLETA EN IOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inicio">

  <title>Pantalla de Inicio</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Contenedor deslizante horizontal (Carrusel) */
    #carrusel {
      display: flex;
      width: 300vw; /* 3 páginas = 300% del ancho de la pantalla */
      height: 100vh;
      height: -webkit-fill-available;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1); /* Movimiento suave estilo iOS */
      will-change: transform;
    }

    /* Cada página individual */
    .pagina {
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      flex-shrink: 0;
    }

    /* Fondos para cada página */
    #pag-1 { background-image: url('pagina1.jpg'); }
    #pag-2 { background-image: url('pagina2.jpg'); }
    #pag-3 { background-image: url('pagina3.jpg'); }

    /* Rejilla de botones invisibles sobre los iconos (Solo activa en la Pagina 1) */
    #grid-teclado {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Teclas invisibles */
    .tecla {
      position: absolute;
      width: 21%;   
      height: 11%;  
      opacity: 0;   
    }

    /* Coordenadas de los 10 iconos (Cuadrícula 4x6 de iOS) */
    .num-1 { top: 8%;  left: 6%; }
    .num-2 { top: 8%;  left: 29%; }
    .num-3 { top: 8%;  left: 52%; }

    .num-4 { top: 22%; left: 6%; }
    .num-5 { top: 22%; left: 29%; }
    .num-6 { top: 22%; left: 52%; }

    .num-7 { top: 36%; left: 6%; }
    .num-8 { top: 36%; left: 29%; }
    .num-9 { top: 36%; left: 52%; }

    .num-0 { top: 50%; left: 29%; }

    #link-atajo {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Contenedor del Carrusel con las 3 páginas montadas de fondo -->
  <div id="carrusel">
    
    <!-- PÁGINA 1: Contiene los botones invisibles para la fuerza -->
    <div class="pagina" id="pag-1">
      <div id="grid-teclado">
        <div class="tecla num-1" onclick="registrarDigito('1')"></div>
        <div class="tecla num-2" onclick="registrarDigito('2')"></div>
        <div class="tecla num-3" onclick="registrarDigito('3')"></div>

        <div class="tecla num-4" onclick="registrarDigito('4')"></div>
        <div class="tecla num-5" onclick="registrarDigito('5')"></div>
        <div class="tecla num-6" onclick="registrarDigito('6')"></div>

        <div class="tecla num-7" onclick="registrarDigito('7')"></div>
        <div class="tecla num-8" onclick="registrarDigito('8')"></div>
        <div class="tecla num-9" onclick="registrarDigito('9')"></div>

        <div class="tecla num-0" onclick="registrarDigito('0')"></div>
      </div>
    </div>

    <!-- PÁGINA 2 -->
    <div class="pagina" id="pag-2"></div>

    <!-- PÁGINA 3 -->
    <div class="pagina" id="pag-3"></div>

  </div>

  <a id="link-atajo" href=""></a>

  <script>
    // --- LÓGICA DE CARRUSEL Y DESLIZAMIENTO FLUIDO (SWIPE) ---
    const totalPaginas = 3;
    let paginaActual = 0;

    let touchStartX = 0;
    let touchEndX = 0;

    const carrusel = document.getElementById('carrusel');

    document.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener('touchend', function(e) {
      touchEndX = e.changedTouches[0].screenX;
      handleGesture();
    }, false);

    function handleGesture() {
      const umbralDesplazamiento = 40;

      // Deslizar a la izquierda (Siguiente página)
      if (touchStartX - touchEndX > umbralDesplazamiento) {
        if (paginaActual < totalPaginas - 1) {
          paginaActual++;
          actualizarPosicion();
        }
      }

      // Deslizar a la derecha (Página anterior)
      if (touchEndX - touchStartX > umbralDesplazamiento) {
        if (paginaActual > 0) {
          paginaActual--;
          actualizarPosicion();
        }
      }
    }

    function actualizarPosicion() {
      // Mueve el contenedor horizontalmente sin recargar ni parpadear
      const desplazamiento = -paginaActual * 100;
      carrusel.style.transform = "translateX(" + desplazamiento + "vw)";
    }

    // --- LÓGICA DE FUERZA (DÍGITOS + ATAJO) ---
    let numeroAcumulado = "";

    function registrarDigito(digito) {
      numeroAcumulado += digito;

      if (numeroAcumulado.length === 2) {
        let numeroFinal = numeroAcumulado;
        numeroAcumulado = "";

        let urlScheme = "shortcuts://run-shortcut?name=DFB_Notas&input=text&text=" + encodeURIComponent(numeroFinal);

        let link = document.getElementById("link-atajo");
        link.href = urlScheme;
        link.click();
      }
    }
  </script>
</body>
</html>
