<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inicio">

  <title>Pantalla de Inicio</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* CARRUSEL DE INICIO */
    #carrusel {
      display: flex;
      width: 300vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
      z-index: 1;
    }

    .pagina {
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      flex-shrink: 0;
    }

    #pag-1 { background-image: url('pagina1.jpg'); }
    #pag-2 { background-image: url('pagina2.jpg'); }
    #pag-3 { background-image: url('pagina3.jpg'); }

    .grid-teclado {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .tecla {
      position: absolute;
      width: 21%;   
      height: 11%;  
      opacity: 0;   
    }

    .num-1 { top: 8%;  left: 6%; }
    .num-2 { top: 8%;  left: 29%; }
    .num-3 { top: 8%;  left: 52%; }

    .num-4 { top: 22%; left: 6%; }
    .num-5 { top: 22%; left: 29%; }
    .num-6 { top: 22%; left: 52%; }

    .num-7 { top: 36%; left: 6%; }
    .num-8 { top: 36%; left: 29%; }
    .num-9 { top: 36%; left: 52%; }

    .num-0 { top: 50%; left: 29%; }

    /* PANTALLA SIMULADA DE NOTAS (Oculta por defecto) */
    #pantalla-notas {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1c1c1e; /* Fondo oscuro estilo Notas de iOS */
      color: #ffffff;
      z-index: 100;
      padding: 60px 20px 20px 20px;
      font-size: 22px;
      line-height: 1.4;
    }

    .notas-header {
      display: flex;
      justify-content: space-between;
      color: #e2b93b; /* Color amarillo oro nativo de Notas iOS */
      font-size: 17px;
      margin-bottom: 25px;
    }

    #texto-revelacion {
      font-size: 28px;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE INICIO (CARRUSEL) -->
  <div id="carrusel">
    <div class="pagina" id="pag-1">
      <div class="grid-teclado">
        <div class="tecla num-1" ontouchstart="registrarDigito('1')"></div>
        <div class="tecla num-2" ontouchstart="registrarDigito('2')"></div>
        <div class="tecla num-3" ontouchstart="registrarDigito('3')"></div>
        <div class="tecla num-4" ontouchstart="registrarDigito('4')"></div>
        <div class="tecla num-5" ontouchstart="registrarDigito('5')"></div>
        <div class="tecla num-6" ontouchstart="registrarDigito('6')"></div>
        <div class="tecla num-7" ontouchstart="registrarDigito('7')"></div>
        <div class="tecla num-8" ontouchstart="registrarDigito('8')"></div>
        <div class="tecla num-9" ontouchstart="registrarDigito('9')"></div>
        <div class="tecla num-0" ontouchstart="registrarDigito('0')"></div>
      </div>
    </div>

    <div class="pagina" id="pag-2">
      <div class="grid-teclado">
        <div class="tecla num-1" ontouchstart="registrarDigito('1')"></div>
        <div class="tecla num-2" ontouchstart="registrarDigito('2')"></div>
        <div class="tecla num-3" ontouchstart="registrarDigito('3')"></div>
        <div class="tecla num-4" ontouchstart="registrarDigito('4')"></div>
        <div class="tecla num-5" ontouchstart="registrarDigito('5')"></div>
        <div class="tecla num-6" ontouchstart="registrarDigito('6')"></div>
        <div class="tecla num-7" ontouchstart="registrarDigito('7')"></div>
        <div class="tecla num-8" ontouchstart="registrarDigito('8')"></div>
        <div class="tecla num-9" ontouchstart="registrarDigito('9')"></div>
        <div class="tecla num-0" ontouchstart="registrarDigito('0')"></div>
      </div>
    </div>

    <div class="pagina" id="pag-3">
      <div class="grid-teclado">
        <div class="tecla num-1" ontouchstart="registrarDigito('1')"></div>
        <div class="tecla num-2" ontouchstart="registrarDigito('2')"></div>
        <div class="tecla num-3" ontouchstart="registrarDigito('3')"></div>
        <div class="tecla num-4" ontouchstart="registrarDigito('4')"></div>
        <div class="tecla num-5" ontouchstart="registrarDigito('5')"></div>
        <div class="tecla num-6" ontouchstart="registrarDigito('6')"></div>
        <div class="tecla num-7" ontouchstart="registrarDigito('7')"></div>
        <div class="tecla num-8" ontouchstart="registrarDigito('8')"></div>
        <div class="tecla num-9" ontouchstart="registrarDigito('9')"></div>
        <div class="tecla num-0" ontouchstart="registrarDigito('0')"></div>
      </div>
    </div>
  </div>

  <!-- INTERFAZ FALSA DE NOTAS -->
  <div id="pantalla-notas">
    <div class="notas-header">
      <span>‹ Notas</span>
      <span>Ok</span>
    </div>
    <div style="color: #8e8e93; font-size: 13px; text-align: center; margin-bottom: 15px;">
      Hoy, 12:00
    </div>
    <div id="texto-revelacion"></div>
  </div>

  <script>
    // --- NAVEGACIÓN SWIPE ---
    const totalPaginas = 3;
    let paginaActual = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    const carrusel = document.getElementById('carrusel');

    document.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});

    document.addEventListener('touchend', function(e) {
      touchEndX = e.changedTouches[0].screenX;
      handleGesture();
    }, {passive: true});

    function handleGesture() {
      const umbralDesplazamiento = 40;
      if (touchStartX - touchEndX > umbralDesplazamiento) {
        if (paginaActual < totalPaginas - 1) {
          paginaActual++;
          actualizarPosicion();
        }
      }
      if (touchEndX - touchStartX > umbralDesplazamiento) {
        if (paginaActual > 0) {
          paginaActual--;
          actualizarPosicion();
        }
      }
    }

    function actualizarPosicion() {
      const desplazamiento = -paginaActual * 100;
      carrusel.style.transform = "translateX(" + desplazamiento + "vw)";
    }

    // --- REVELACIÓN ---
    let numeroAcumulado = "";

    function registrarDigito(digito) {
      numeroAcumulado += digito;

      if (numeroAcumulado.length === 2) {
        let numeroFinal = numeroAcumulado;
        numeroAcumulado = "";

        // Muestra la pantalla simulada de notas instantáneamente
        document.getElementById('texto-revelacion').innerText = "Número pensado: " + numeroFinal;
        document.getElementById('pantalla-notas').style.display = "block";
      }
    }
  </script>
</body>
</html>
